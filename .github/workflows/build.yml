name: Build
on:
  push:
    branches:
      - main
    tags:
      - '**'

  pull_request:
    branches:
      - '**'

# Only pull request runs are cancelled by a newer push. Runs on main always finish, so they save the
# Rust caches that pull requests restore from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4

      - name: Cache PNPM dependencies
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Prettier
        run: |
          pnpm prettier:check --version
          pnpm prettier:check

      - name: Install GTK
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y libgtk-3-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets

      - name: Test
        run: cargo test --workspace --all-features

      - name: Unused dependencies
        run: |
          cargo install cargo-machete --locked
          cargo machete --skip-target-dir

      - name: Fmt
        run: cargo fmt --all -- --files-with-diff --check

  build:
    name: ${{ matrix.platform_name }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-15'
            platform_name: MacOS
            cache_key: macos
            # Pull requests only build for Apple silicon, which takes half as long as a universal build.
            mac_target: ${{ github.event_name == 'pull_request' && 'aarch64-apple-darwin' || 'universal-apple-darwin' }}
            build: ${{ github.event_name == 'pull_request' && 'pnpm tauri build --target aarch64-apple-darwin' || 'pnpm tauri build --target universal-apple-darwin' }}
          - platform: 'ubuntu-22.04'
            platform_name: Linux (x64)
            cache_key: linux-x64
            build: 'pnpm tauri build'
          - platform: 'linux-arm64'
            platform_name: Linux (ARM)
            cache_key: linux-arm64
            build: 'pnpm tauri build --target aarch64-unknown-linux-gnu'
          - platform: 'windows-2022'
            platform_name: Windows (x64)
            cache_key: windows-x64
            build: 'pnpm tauri build'
          - platform: 'windows-2022'
            platform_name: Windows (ARM)
            cache_key: windows-arm64
            build: 'pnpm tauri build --target aarch64-pc-windows-msvc'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add x86_64-apple-darwin
        if: matrix.mac_target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Add aarch64-pc-windows-msvc
        if: matrix.platform_name == 'Windows (ARM)'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Add aarch64-unknown-linux-gnu
        if: matrix.platform_name == 'Linux (ARM)'
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache_key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ubuntu dependencies
        if: startsWith(matrix.platform_name, 'Linux')
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y libgtk-3-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Flatpak dependencies
        if: matrix.platform_name == 'Linux (x64)'
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Ubuntu ARM dependencies
        if: matrix.platform_name == 'Linux (ARM)'
        run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --reinstall xdg-utils

      - name: Windows dependencies
        if: startsWith(matrix.platform_name, 'Windows')
        run: |
          choco install nasm
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache PNPM dependencies
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frontend dependencies
        run: pnpm install

      - name: Save API key to file
        if: matrix.platform_name == 'MacOS'
        run: |
          mkdir -p ~/private_keys
          echo -n '${{ secrets.APPLE_API_SECRET_KEY }}' > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Bindgen CLI
        run: cargo install bindgen-cli --locked

      # On MacOS we only notarize on tagged releases
      - name: Build with secrets
        if: matrix.platform_name == 'MacOS' && startsWith(github.event.ref, 'refs/tags/v')
        run: ${{ matrix.build }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          CI: true

      # We don't currently do signing on other platforms
      - name: Build without secrets
        if: ${{ !(matrix.platform_name == 'MacOS' && startsWith(github.event.ref, 'refs/tags/v')) }}
        run: ${{ matrix.build }}
        env:
          CI: true

      # MacOS
      - name: Upload APP (MacOS)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'MacOS'
        with:
          name: Sage.app
          path: target/${{ matrix.mac_target }}/release/bundle/macos/*.app

      - name: Upload DMG (MacOS)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'MacOS'
        with:
          name: Sage.dmg
          path: target/${{ matrix.mac_target }}/release/bundle/dmg/*.dmg

      - name: Release (MacOS)
        uses: softprops/action-gh-release@v2
        if: matrix.platform_name == 'MacOS' && startsWith(github.event.ref, 'refs/tags/v')
        with:
          files: |
            target/${{ matrix.mac_target }}/release/bundle/macos/*.app
            target/${{ matrix.mac_target }}/release/bundle/dmg/*.dmg

      # Linux x64
      - name: Package Flatpak (Linux x64)
        if: matrix.platform_name == 'Linux (x64)'
        run: pnpm package:flatpak target/release/bundle/deb/*.deb

      - name: Upload Flatpak (Linux x64)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Linux (x64)'
        with:
          name: Sage_x64.flatpak
          path: target/release/bundle/flatpak/*.flatpak

      - name: Upload DEB (Linux x64)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Linux (x64)'
        with:
          name: Sage_x64.deb
          path: target/release/bundle/deb/*.deb

      - name: Upload DMG (Linux x64)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Linux (x64)'
        with:
          name: Sage_x64.rpm
          path: target/release/bundle/rpm/*.rpm

      - name: Upload AppImage (Linux x64)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Linux (x64)'
        with:
          name: Sage_x64.AppImage
          path: target/release/bundle/appimage/*.AppImage

      - name: Release (Linux x64)
        uses: softprops/action-gh-release@v2
        if: matrix.platform_name == 'Linux (x64)' && startsWith(github.event.ref, 'refs/tags/v')
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/flatpak/*.flatpak
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

      # Linux ARM
      - name: Upload DEB (Linux ARM)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Linux (ARM)'
        with:
          name: Sage_ARM64.deb
          path: target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb

      - name: Upload DMG (Linux ARM)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Linux (ARM)'
        with:
          name: Sage_ARM64.rpm
          path: target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm

      - name: Upload AppImage (Linux ARM)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Linux (ARM)'
        with:
          name: Sage_ARM64.AppImage
          path: target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

      - name: Release (Linux ARM)
        uses: softprops/action-gh-release@v2
        if: matrix.platform_name == 'Linux (ARM)' && startsWith(github.event.ref, 'refs/tags/v')
        with:
          files: |
            target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

      # Windows x64
      - name: Upload MSI (Windows x64)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Windows (x64)'
        with:
          name: Sage_x64.msi
          path: target/release/bundle/msi/*.msi

      - name: Upload EXE (Windows x64)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Windows (x64)'
        with:
          name: Sage_x64.exe
          path: target/release/bundle/nsis/*.exe

      - name: Release (Windows x64)
        uses: softprops/action-gh-release@v2
        if: matrix.platform_name == 'Windows (x64)' && startsWith(github.event.ref, 'refs/tags/v')
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      # Windows ARM
      - name: Upload MSI (Windows ARM)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Windows (ARM)'
        with:
          name: Sage_ARM64.msi
          path: target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi

      - name: Upload EXE (Windows ARM)
        uses: actions/upload-artifact@v4
        if: matrix.platform_name == 'Windows (ARM)'
        with:
          name: Sage_ARM64.exe
          path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Release (Windows ARM)
        uses: softprops/action-gh-release@v2
        if: matrix.platform_name == 'Windows (ARM)' && startsWith(github.event.ref, 'refs/tags/v')
        with:
          files: |
            target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
            target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

  # iOS and Android builds only run for pushes to main and tags, not pull requests. They're slow,
  # the iOS builds can only be installed through TestFlight, and pull requests from forks don't
  # get the signing secrets they need.
  build-mobile:
    name: Mobile
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/mobile.yml
    permissions:
      contents: write
    secrets: inherit

  npm:
    name: NPM
    uses: ./.github/workflows/npm-validate.yml

  # The only check that branch protection needs to require. A skipped job counts as passing, so
  # this always runs and fails explicitly if anything it depends on didn't succeed.
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [tests, build, build-mobile, npm]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed"
          exit 1
