[package]
name = "sage-auth"
version = "0.13.1"
edition = "2024"
license = "Apache-2.0"
description = "Shared authorization for the Sage wallet."
authors = ["Rigidity <me@rigidnetwork.com>"]
homepage = "https://github.com/rigidity/sage"
repository = "https://github.com/rigidity/sage"
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[features]
tauri = ["dep:specta"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
specta = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
